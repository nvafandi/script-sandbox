# Publish script-sandbox to npm from CI — no local `npm publish` anymore.
#
# How it works
#   Trigger : every push to main + manual run (workflow_dispatch).
#   Publish : only when the package.json version is NOT on the registry yet
#             AND the push actually changed package.json (manual runs always
#             try). Pushes without a version bump only run the tests.
#   Auth    : npm Trusted Publishing (OIDC) — no token, no repo secret.
#             One-time setup on npmjs.com:
#               Packages -> script-sandbox -> Settings -> Trusted publishing
#               -> GitHub Actions:
#                 Organisation/user : nvafandi
#                 Repository        : script-sandbox
#                 Workflow filename : npm-publish.yml  (exact, incl. .yml)
#                 Allowed actions   : also tick "npm publish"
#                                     ("npm stage publish" is always allowed)
#             Rules: npm CLI >= 11.5.1 + Node >= 22.14 (the workflow installs
#             the newest npm), and the configuration expires unless the first
#             publish succeeds within 2 days of creating it.
#   Provenance: generated automatically by npm for OIDC publishes from a
#             public GitHub repo — no flag needed.
#
# Docs: https://docs.npmjs.com/trusted-publishers

name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # OIDC token for npm trusted publishing
  contents: read

# Never run two publish jobs at the same time.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    # The test suite runs PowerShell, cmd and Git Bash tools -> Windows runner.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history: the "did package.json change?" diff needs the previous push

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false # never use caching in release builds

      - name: Use a recent npm (trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # The suite resolves bash.exe from PATH (the `sh` language + .sh runs);
      # on hosted runners Git lives in "C:\Program Files\Git" but its bin dir is
      # not always on PATH. Prepend it for the steps below.
      - name: Put Git Bash on PATH
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\bin'

      - name: Test (smoke + config-check + clients-check + compat-check)
        # cmd does the redirection as plain text (no PowerShell stream quirks);
        # on failure the tail of the output is published as an annotation so the
        # reason shows up on the commit page without digging through logs.
        run: |
          $ErrorActionPreference = 'Continue'
          cmd /d /c "npm test > test-output.log 2>&1"
          $code = $LASTEXITCODE
          Get-Content test-output.log
          if ($code -ne 0) {
            $lines = Get-Content test-output.log -Tail 40 | ForEach-Object { if ($_.Length -gt 300) { $_.Substring(0, 300) } else { $_ } }
            $msg = ($lines -join "`n").Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
            Write-Output "::error::npm test failed (exit $code) - last lines: %0A$msg"
          }
          exit $code

      - name: Decide what to publish
        id: decide
        # PowerShell (the Windows default shell) so nothing here depends on
        # bash being on PATH.
        run: |
          $ErrorActionPreference = 'Continue'
          $version = node -p "require('./package.json').version"
          if (-not $version) { exit 1 }

          npm view "script-sandbox@$version" version > $null 2>&1
          $onRegistry = if ($LASTEXITCODE -eq 0) { 'true' } else { 'false' }

          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $changed = 'true'
          } else {
            git diff --quiet '${{ github.event.before }}' HEAD -- package.json
            # 0 = package.json untouched; anything else (changed or an
            # unreadable range) falls back to "treat as changed".
            $changed = if ($LASTEXITCODE -eq 0) { 'false' } else { 'true' }
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "on_registry=$onRegistry"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "changed=$changed"
          Write-Host "script-sandbox@$version | on registry: $onRegistry | package.json changed: $changed"

      - name: Publish to npm (OIDC, provenance automatic)
        if: steps.decide.outputs.on_registry == 'false' && steps.decide.outputs.changed == 'true'
        run: npm publish
