# Publish script-sandbox to npm from CI — no local `npm publish` anymore.
#
# How it works
#   PR to main         : run the test suite only (validation before merge;
#                        PRs never publish).
#   Merge PR into main : run the tests, then publish — but only when
#                          - the head commit belongs to a merged PR that
#                            targeted main (direct pushes never publish), AND
#                          - the pushed range changed package.json, AND
#                          - that version is not on the registry yet.
#   workflow_dispatch  : manual escape hatch ("Run workflow"); always tries —
#                        e.g. for a version whose bump did not go through a PR.
#   Auth : npm Trusted Publishing (OIDC) — no token, no repo secret.
#     One-time setup on npmjs.com:
#       Packages -> script-sandbox -> Settings -> Trusted publishing
#       -> GitHub Actions:
#         Organisation/user : nvafandi
#         Repository        : script-sandbox
#         Workflow filename : npm-publish.yml  (exact, incl. .yml)
#         Allowed actions   : also tick "npm publish"
#                             ("npm stage publish" is always allowed)
#     Rules: npm CLI >= 11.5.1 + Node >= 22.14 (the publish job installs the
#     newest npm), and the configuration expires unless the first publish
#     succeeds within 2 days of creating it.
#   Provenance: generated automatically by npm for OIDC publishes from a
#     public GitHub repo — no flag needed.
#   Security           : job `scan` runs the Snyk dependency scan (npx snyk
#                        test) before `test`; any finding fails the chain.
#
# Docs: https://docs.npmjs.com/trusted-publishers

name: Publish to npm

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref: superseded PR runs are cancelled, main runs are not.
concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    # Security gate, first in the chain: Snyk dependency scan. Any finding fails
    # the job, so `test` and `publish` never run on a vulnerable tree. Skipped
    # (with a note) when the secret is unavailable, e.g. fork PRs / Dependabot.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Snyk security scan (dependencies)
        if: env.SNYK_TOKEN != ''
        run: npx --yes snyk test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Note when the scan was skipped
        if: env.SNYK_TOKEN == ''
        run: Write-Host "SNYK_TOKEN is not set - dependency scan skipped."

  test:
    needs: scan
    # The test suite runs PowerShell, cmd and Git Bash tools -> Windows runner.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false # never use caching in release builds

      # The suite resolves bash.exe from PATH (the `sh` language + .sh runs);
      # on hosted runners Git lives in "C:\Program Files\Git" but its bin dir is
      # not always on PATH. Prepend it for the steps below.
      - name: Put Git Bash on PATH
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\bin'

      - name: Install dependencies
        run: npm ci

      - name: Test (smoke + config-check + clients-check + compat-check)
        # cmd does the redirection as plain text (no PowerShell stream quirks);
        # on failure the tail of the output is published as an annotation so the
        # reason shows up on the commit page without digging through logs.
        run: |
          $ErrorActionPreference = 'Continue'
          cmd /d /c "npm test > test-output.log 2>&1"
          $code = $LASTEXITCODE
          Get-Content test-output.log
          if ($code -ne 0) {
            $lines = Get-Content test-output.log -Tail 40 | ForEach-Object { if ($_.Length -gt 300) { $_.Substring(0, 300) } else { $_ } }
            $msg = ($lines -join "`n").Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
            Write-Output "::error::npm test failed (exit $code) - last lines: %0A$msg"
          }
          exit $code

  publish:
    needs: test
    # Never on pull_request events: PR code must not receive an OIDC token and
    # unmerged code must never be published.
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history: the "did package.json change?" diff needs the previous push

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false # never use caching in release builds

      - name: Use a recent npm (trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest

      # npm publish runs prepublishOnly (= the full suite) -> same needs as test.
      - name: Install dependencies
        run: npm ci

      - name: Put Git Bash on PATH
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\bin'

      - name: Decide what to publish
        id: decide
        # PowerShell so nothing here depends on bash being on PATH.
        env:
          PR_LOOKUP_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          $version = node -p "require('./package.json').version"
          if (-not $version) { exit 1 }

          npm view "script-sandbox@$version" version > $null 2>&1
          $onRegistry = if ($LASTEXITCODE -eq 0) { 'true' } else { 'false' }

          $publish = 'false'
          $reason = ''
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $publish = 'true'
            $reason = 'manual run'
          } else {
            # push to main: only commits that belong to a merged PR may publish
            $headers = @{
              Authorization          = "Bearer $env:PR_LOOKUP_TOKEN"
              Accept                 = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
              'User-Agent'           = 'script-sandbox-ci'
            }
            $url = 'https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/pulls'
            $prs = @()
            try { $prs = @(Invoke-RestMethod -Headers $headers -Uri $url) }
            catch { Write-Host "PR lookup failed: $_" }
            $merged = $prs | Where-Object { $_.merged_at -and $_.base.ref -eq 'main' } | Select-Object -First 1
            if ($merged) {
              $publish = 'true'
              $reason = "merged PR #$($merged.number): $($merged.title)"
              git diff --quiet '${{ github.event.before }}' HEAD -- package.json
              # 0 = package.json untouched; anything else (changed or an
              # unreadable range) falls back to "treat as changed".
              if ($LASTEXITCODE -eq 0) {
                $publish = 'false'
                $reason = 'package.json unchanged in the pushed range'
              }
            } else {
              $reason = 'head commit is not from a merged PR -> tests only'
            }
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "on_registry=$onRegistry"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "publish=$publish"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "reason=$reason"
          Write-Host "script-sandbox@$version | on registry: $onRegistry | publish: $publish ($reason)"
          # Explicit exit: the runner's pwsh wrapper ends with
          # `exit $LASTEXITCODE`, so without this the step would exit with the
          # last native command's code — npm view's 404 (= version not on the
          # registry, the normal case) fails the whole job otherwise.
          exit 0

      - name: Publish to npm (OIDC, provenance automatic)
        if: steps.decide.outputs.publish == 'true' && steps.decide.outputs.on_registry == 'false'
        # cmd does the redirection as plain text (no PowerShell stream quirks);
        # on failure the tail of the output is published as an annotation so the
        # reason shows up on the commit page without digging through logs.
        run: |
          $ErrorActionPreference = 'Continue'
          cmd /d /c "npm publish > publish-output.log 2>&1"
          $code = $LASTEXITCODE
          Get-Content publish-output.log
          if ($code -ne 0) {
            $lines = Get-Content publish-output.log -Tail 40 | ForEach-Object { if ($_.Length -gt 300) { $_.Substring(0, 300) } else { $_ } }
            $msg = ($lines -join "`n").Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
            Write-Output "::error::npm publish failed (exit $code) - last lines: %0A$msg"
          }
          exit $code
